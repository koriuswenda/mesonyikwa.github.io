<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body data-page="login">
<div id="site-header"></div>
<div class="page-hero"><div class="wrap"><h1>Masuk</h1><p>Masuk untuk memesan dan checkout.</p></div></div>
<main class="wrap" style="padding:40px 0">

<div class="msg" id="msg"></div><button class="btn btn-primary">Masuk</button><p class="alt">Belum punya akun? <a href="register.html">Daftar</a></p></form>

<div id="site-footer"></div>
